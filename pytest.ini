[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers -n auto
# -n auto: parallel across CPUs (pytest-xdist).  The suite is build-bound
# (each airport ~60 s elevation solve); parallelism cuts wall time ~4-5x.
# Use `-n0` to force serial (e.g. for pdb / single-test debugging).
filterwarnings =
    ignore::DeprecationWarning
