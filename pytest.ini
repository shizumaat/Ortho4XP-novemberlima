[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers -n auto --dist loadgroup
# -n auto: parallel across CPUs (pytest-xdist).  The suite is build-bound
# (each airport ~60 s elevation solve); parallelism cuts wall time ~4-5x.
# Use `-n0` to force serial (e.g. for pdb / single-test debugging).
# --dist loadgroup: keep all tests sharing an xdist_group on one worker.
# conftest assigns each airport-parametrised test the group <icao> so the
# shared layout cache builds each airport exactly ONCE per run.
markers =
    xdist_group: pin tests sharing a group to the same xdist worker (pytest-xdist)
filterwarnings =
    ignore::DeprecationWarning
