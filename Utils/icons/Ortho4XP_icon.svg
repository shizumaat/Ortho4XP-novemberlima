<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Ortho4XP app icon: an orthophoto tile seen from above — ocean,
       coastline, the 1-degree graticule, and one tile selected for build. -->
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E86C9"/>
      <stop offset="1" stop-color="#0F4E86"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DB65C"/>
      <stop offset="1" stop-color="#4E8A3F"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="60" y="60" width="904" height="904" rx="202" ry="202"/>
    </clipPath>
  </defs>

  <rect x="60" y="60" width="904" height="904" rx="202" ry="202" fill="url(#ocean)"/>

  <g clip-path="url(#squircle)">
    <!-- landmass with beach fringe -->
    <path d="M -40 700 C 140 610 200 660 320 590 C 430 525 420 430 560 400
             C 700 370 760 260 900 250 C 1000 243 1060 280 1100 320
             L 1100 1100 L -40 1100 Z"
          fill="#E4CE96"/>
    <path d="M -40 730 C 140 640 210 690 330 620 C 440 555 445 460 585 430
             C 725 400 790 290 930 280 C 1010 274 1070 305 1100 340
             L 1100 1100 L -40 1100 Z"
          fill="url(#land)"/>
    <!-- graticule -->
    <g stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="10">
      <line x1="286" y1="60" x2="286" y2="964"/>
      <line x1="512" y1="60" x2="512" y2="964"/>
      <line x1="738" y1="60" x2="738" y2="964"/>
      <line x1="60" y1="286" x2="964" y2="286"/>
      <line x1="60" y1="512" x2="964" y2="512"/>
      <line x1="60" y1="738" x2="964" y2="738"/>
    </g>
    <!-- selected tile -->
    <rect x="512" y="286" width="226" height="226" fill="#FFFFFF" fill-opacity="0.18"/>
    <rect x="512" y="286" width="226" height="226" fill="none"
          stroke="#FFFFFF" stroke-width="22"/>
    <!-- aircraft in the selected tile -->
    <g transform="translate(625,399) rotate(45)" fill="#FFFFFF">
      <path d="M 0 -78 C 10 -60 12 -42 12 -22 L 12 -8 L 72 26 L 72 48 L 12 30
               L 12 58 L 34 74 L 34 90 L 0 80 L -34 90 L -34 74 L -12 58
               L -12 30 L -72 48 L -72 26 L -12 -8 L -12 -22
               C -12 -42 -10 -60 0 -78 Z"/>
    </g>
  </g>
</svg>
